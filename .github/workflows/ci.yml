name: Windows build and audio checks
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build XSurLab.slnx -c Release
      - run: dotnet run --project tests/XSurLab.SmokeTests -c Release --no-build
